[project]
name = "simplicity-studio-gui-automation"
version = "0.1.0"
description = "Robot Framework + pywinauto automation for Silicon Labs Simplicity Studio"
requires-python = ">=3.11"
dependencies = [
    "robotframework>=7.0,<8.0",
    "pywinauto>=0.6.9,<0.7",
    "pywin32>=306",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
